# Модель оценивания по дисциплине Д3
# Программа ДПО «Искусственный интеллект и цифровые технологии в медицине»

discipline: "Машинное обучение без кода: AutoML и предиктивная медицина"
discipline_code: D3
semester: 7

control:
  type: "зачёт (промежуточная аттестация)"
  format: "защита парного проекта + индивидуальная письменная мини-рецензия + AI-free расчёт метрик"
  session: "занятие 12; рецензия сдаётся письменно до защиты"

artifacts:
  - id: team_project
    name: "Парный проект «Предиктивная модель»"
    kind: "парный (межпрофессиональная пара «студент-медик + ИТ-студент технического вуза»; роли фиксируются в отчёте)"
    description: >-
      Полный цикл на сквозном учебном регистре (деперсонализированная выгрузка
      клиники-партнёра; запасной открытый датасет — по согласованию):
      клинический вопрос, подготовка данных,
      сравнение алгоритмов в Orange и AutoML, честная валидация, выбор порога,
      SHAP-интерпретация, аудит подгрупп, ограничения. Пакет: доклад,
      файлы .ows, данные, паспорт проекта с фиксацией ролей.
  - id: article_review
    name: "Мини-рецензия на статью с ML-моделью"
    kind: "индивидуальный"
    description: >-
      Критический разбор опубликованной статьи с предиктивной моделью по
      чек-листу TRIPOD+AI, 1–2 страницы: данные, валидация, метрики,
      применимость, что не отражено в отчётности.
  - id: ai_free_metrics
    name: "AI-free контрольная точка: ручной расчёт метрик"
    kind: "индивидуальный"
    description: >-
      Ручной расчёт и интерпретация Se/Sp/PPV/NPV по предъявленной матрице
      ошибок — без компьютера и ИИ; навык вводится на занятии 4
      («Метрики руками и машиной») и повторяется на зачёте.
      Оценивается «пройдено / не пройдено».

criteria:
  - id: C1
    name: "Актуальность проблемы и практическая польза"
    weight_percent: 25
    checks:
      - "клинический вопрос сформулирован и обоснован"
      - "понятен пользователь модели и сценарий применения"
  - id: C2
    name: "Корректность методов (данные, метрики, валидация, право)"
    weight_percent: 25
    checks:
      - "данные корректны: сквозной регистр в рамках условий использования (или согласованный открытый датасет с лицензией), подготовка задокументирована"
      - "метрики соответствуют задаче, порог обоснован клинически"
      - "валидация без утечек: разделение выборок, кросс-валидация, отложенный тест"
  - id: C3
    name: "Работоспособность и воспроизводимость результата"
    weight_percent: 25
    checks:
      - "конвейер .ows открывается и воспроизводит заявленные результаты"
      - "приложены данные, настройки, протокол решений"
  - id: C4
    name: "Качество защиты и рефлексия ограничений"
    weight_percent: 25
    checks:
      - "ответы на вопросы по существу, владение материалом у обоих участников пары"
      - "роли медика и ИТ-студента зафиксированы в отчёте"
      - "ограничения и риски модели сформулированы честно"
      - "мини-рецензия сдана и самостоятельна"

grading:
  scale: "100 баллов (взвешенная сумма критериев)"
  result: "зачтено / не зачтено"
  pass_rule: "не менее 60 баллов из 100, не менее 10 баллов по каждому критерию и пройденная AI-free контрольная точка"
  retake: >-
    При незачёте пара дорабатывает проект по замечаниям и защищается
    повторно в сроки пересдач; рецензия и AI-free контрольная точка
    пересдаются индивидуально.
