# Модель оценивания по дисциплине Д3
# Программа ДПО «Искусственный интеллект и цифровые технологии в медицине»

discipline: "Машинное обучение без кода: AutoML и предиктивная медицина"
discipline_code: D3
semester: 7

control:
  type: "зачёт (промежуточная аттестация)"
  format: "защита командного проекта + индивидуальная письменная мини-рецензия"
  session: "занятие 12; рецензия сдаётся письменно до защиты"

artifacts:
  - id: team_project
    name: "Командный проект «Предиктивная модель»"
    kind: "командный (3–4 студента)"
    description: >-
      Полный цикл на открытом табличном датасете (типовая задача — прогноз
      сердечно-сосудистого риска): клинический вопрос, подготовка данных,
      сравнение алгоритмов в Orange и AutoML, честная валидация, выбор порога,
      SHAP-интерпретация, аудит подгрупп, ограничения. Пакет: доклад,
      файлы .ows, данные, паспорт проекта.
  - id: article_review
    name: "Мини-рецензия на статью с ML-моделью"
    kind: "индивидуальный"
    description: >-
      Критический разбор опубликованной статьи с предиктивной моделью по
      чек-листу TRIPOD+AI, 1–2 страницы: данные, валидация, метрики,
      применимость, что не отражено в отчётности.

criteria:
  - id: C1
    name: "Актуальность проблемы и практическая польза"
    weight_percent: 25
    checks:
      - "клинический вопрос сформулирован и обоснован"
      - "понятен пользователь модели и сценарий применения"
  - id: C2
    name: "Корректность методов (данные, метрики, валидация, право)"
    weight_percent: 25
    checks:
      - "данные открытые, лицензия соблюдена, подготовка задокументирована"
      - "метрики соответствуют задаче, порог обоснован клинически"
      - "валидация без утечек: разделение выборок, кросс-валидация, отложенный тест"
  - id: C3
    name: "Работоспособность и воспроизводимость результата"
    weight_percent: 25
    checks:
      - "конвейер .ows открывается и воспроизводит заявленные результаты"
      - "приложены данные, настройки, протокол решений"
  - id: C4
    name: "Качество защиты и рефлексия ограничений"
    weight_percent: 25
    checks:
      - "ответы на вопросы по существу, владение материалом у всех участников"
      - "ограничения и риски модели сформулированы честно"
      - "мини-рецензия сдана и самостоятельна"

grading:
  scale: "100 баллов (взвешенная сумма критериев)"
  result: "зачтено / не зачтено"
  pass_rule: "не менее 60 баллов из 100 и не менее 10 баллов по каждому критерию"
  retake: >-
    При незачёте команда дорабатывает проект по замечаниям и защищается
    повторно в сроки пересдач; рецензия пересдаётся индивидуально.
